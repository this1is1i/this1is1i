# All connection settings must be supplied by a project-local external properties file.
spring.datasource.url=${article.mysql.url}
spring.datasource.username=${article.mysql.username}
spring.datasource.password=${article.mysql.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.datasource.hikari.data-source-properties.preserveInstants=true
# Apply schema-mysql.sql explicitly to a new business schema, never to the governance database.
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema-mysql.sql
